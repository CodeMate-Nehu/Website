<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | CodeMate</title>
    <meta name="description" content="Get in touch with CodeMate team for inquiries, collaborations, and community support.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=League+Spartan:wght@600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Lucide Icons & FontAwesome 6 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
    <style>
        :root {
            --brand-primary: #f37f30;
            --brand-primary-dark: #d5641b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #fdfdfd;
            background-image:
              linear-gradient(to right, rgba(36, 36, 36, 0.05) 1px, transparent 1px),
              linear-gradient(to bottom, rgba(26, 25, 25, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            color: #111827;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .font-heading {
            font-family: 'League Spartan', sans-serif;
        }

        /* Hero Contact Section */
        .contact-hero-section {
            padding: 120px 20px 40px 20px;
            text-align: center;
        }

        .contact-title {
            font-family: 'League Spartan', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            line-height: 1.05;
            color: #111827;
            margin: 0 0 0.5rem 0;
            letter-spacing: -0.02em;
        }

        @media (min-width: 640px) {
            .contact-title {
                font-size: 4.5rem;
            }
        }

        .accent-bar {
            width: 48px;
            height: 5px;
            background: #f37f30;
            border-radius: 9999px;
            margin: 1.25rem auto 3rem auto;
        }

        /* Form Card Container */
        .contact-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 1.25rem 4rem 1.25rem;
        }

        .form-card-wrapper {
            max-width: 720px;
            margin: 0 auto 3rem auto;
            background: #ffffff;
            border-radius: 2rem;
            border: 1px solid rgba(229, 231, 235, 0.9);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.03);
            overflow: hidden;
            padding: 1rem;
        }

        .google-form-iframe {
            width: 100%;
            height: 980px;
            border: none;
            border-radius: 1.5rem;
            display: block;
        }

        /* 3 Bottom Info Cards */
        .contact-info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.25rem;
            max-width: 760px;
            margin: 0 auto;
        }

        @media (max-width: 640px) {
            .contact-info-grid {
                grid-template-columns: 1fr;
            }
        }

        .info-card {
            background: #ffffff;
            border-radius: 1.25rem;
            border: 1px solid rgba(229, 231, 235, 0.9);
            padding: 1.5rem 1rem;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.02);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.25s ease;
        }

        .info-card:hover {
            transform: translateY(-4px);
            border-color: rgba(243, 127, 48, 0.4);
            box-shadow: 0 15px 30px rgba(243, 127, 48, 0.08);
        }

        .info-icon {
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 50%;
            background: rgba(243, 127, 48, 0.1);
            color: #f37f30;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.25rem;
        }

        .info-label {
            font-size: 0.6875rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            color: #9ca3af;
            text-transform: uppercase;
        }

        .info-value {
            font-size: 0.875rem;
            font-weight: 700;
            color: #111827;
            margin: 0;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>

    <!-- HERO CONTACT SECTION -->
    <section class="contact-hero-section">
        <h1 class="contact-title">Get in touch<br>with us!</h1>
        <div class="accent-bar"></div>
    </section>

    <!-- FORM & INFO CARDS -->
    <main class="contact-container">
        <!-- Google Form Embed Wrapper -->
        <div class="form-card-wrapper">
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSeU8B_Ab7JC9UWs-_FPrr1k764gLLYCVYgjkyf1T97y9IxlKw/viewform?embedded=true" class="google-form-iframe" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
        </div>

        <!-- 3 Info Cards Bottom Row -->
        <div class="contact-info-grid">
            <!-- Email Us -->
            <div class="info-card">
                <div class="info-icon">
                    <i data-lucide="mail" style="width: 1.1rem; height: 1.1rem;"></i>
                </div>
                <span class="info-label">EMAIL US</span>
                <p class="info-value">codemate.nehu@gmail.com</p>
            </div>

            <!-- Visit Us -->
            <div class="info-card">
                <div class="info-icon">
                    <i data-lucide="map-pin" style="width: 1.1rem; height: 1.1rem;"></i>
                </div>
                <span class="info-label">VISIT US</span>
                <p class="info-value">SoT, NEHU, Shillong</p>
            </div>

            <!-- Community -->
            <div class="info-card">
                <div class="info-icon">
                    <i data-lucide="message-square" style="width: 1.1rem; height: 1.1rem;"></i>
                </div>
                <span class="info-label">COMMUNITY</span>
                <p class="info-value">Discord & Slack</p>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="../script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) window.lucide.createIcons();
        });
    </script>
</body>
</html>
